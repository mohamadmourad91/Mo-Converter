name: build
on:
  push:
  pull_request:
jobs:
  build:
    # Windows: the program uses WPF, the Windows PDF renderer and Windows text recognition.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The video and audio tests run the real FFmpeg (pinned LGPL build, checksum-verified).
      - name: Fetch FFmpeg
        shell: pwsh
        run: ./build/get-ffmpeg.ps1
      - run: dotnet build MoConverter.slnx -c Release -warnaserror
      - name: Test
        run: dotnet test MoConverter.slnx -c Release --no-build --logger "trx" --results-directory TestResults
      # The step log needs a sign-in to read; this puts each failed test on the run page as an annotation.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $files = @(Get-ChildItem -Path . -Filter *.trx -Recurse -ErrorAction SilentlyContinue)
          Write-Host "::notice::trx files found: $($files.Count)"
          foreach ($file in $files) {
            try {
              [xml]$trx = Get-Content -LiteralPath $file.FullName -Raw
              foreach ($r in @($trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' })) {
                $message = "$($r.Output.ErrorInfo.Message)" -replace '[\r\n]+', ' | '
                if ($message.Length -gt 500) { $message = $message.Substring(0, 500) }
                Write-Host "::error::FAILED $($r.testName) -- $message"
              }
            }
            catch {
              Write-Host "::error::could not read $($file.Name): $($_.Exception.Message)"
            }
          }
          exit 0
